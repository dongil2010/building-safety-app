name: Deploy web (GitHub Pages)

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  # firestore.rules / storage.rules 는 GitHub Pages로 배포되지 않는다.
  # 2026-09-11·09-17 두 번 모두 "코드는 올라갔는데 규칙은 콘솔에 옛 버전"이라 현장이
  # permission-denied로 멈췄다. CI는 초록불인데 앱만 죽는 게 문제였다.
  # 그래서 규칙 배포를 사이트 배포보다 **먼저** 세우고, 실패하면 사이트도 안 나가게 한다.
  rules:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # 규칙 파일이 안 바뀐 푸시까지 매번 배포하면 Firebase 룰셋 이력만 쌓인다.
      - id: check
        name: 규칙 파일이 바뀌었는지 확인
        run: |
          if [ "${{ github.event_name }}" != "push" ]; then
            echo "규칙 파일 변경 여부와 상관없이 배포한다 (수동 실행)"
            echo "changed=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          before="${{ github.event.before }}"
          if [ -z "$before" ] || [ "$before" = "0000000000000000000000000000000000000000" ] \
             || ! git cat-file -e "$before^{commit}" 2>/dev/null; then
            echo "직전 커밋을 알 수 없어 그냥 배포한다"
            echo "changed=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if git diff --name-only "$before" "${{ github.sha }}" \
             | grep -qE '^(firestore\.rules|storage\.rules|firebase\.json)$'; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "규칙 파일 변경 없음 — 배포 생략"
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Firestore·Storage 규칙 배포
        if: steps.check.outputs.changed == 'true'
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          if [ -z "$FIREBASE_SERVICE_ACCOUNT" ]; then
            echo "::error::규칙 파일이 바뀌었는데 FIREBASE_SERVICE_ACCOUNT 시크릿이 없다. docs/firebase-rules-ci.md 참고. 등록 전까지는 Firebase 콘솔에 직접 붙여넣어 게시할 것."
            exit 1
          fi
          key="$RUNNER_TEMP/firebase-sa.json"
          printf '%s' "$FIREBASE_SERVICE_ACCOUNT" > "$key"
          trap 'rm -f "$key"' EXIT
          export GOOGLE_APPLICATION_CREDENTIALS="$key"
          npx --yes firebase-tools@13 deploy \
            --only firestore:rules,storage \
            --project building-safety-app-46821 \
            --non-interactive

  deploy:
    needs: rules
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Run unit tests
        run: npm test
      - name: Prepare static site
        run: python3 scripts/prepare-pages.py
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
