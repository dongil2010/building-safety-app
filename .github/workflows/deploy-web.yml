name: Deploy web (GitHub Pages)

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write
  # deploy-pages가 이 실행의 github-pages 묶음을 API로 찾을 때 필요(2026-11-25부터 없으면 「묶음 없음」으로 실패)
  actions: read

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  # 테스트를 맨 앞에 둔다(2026-09-29). 예전엔 규칙 게시(rules)가 먼저 돌고 테스트는 사이트 배포
  # 단계에서 돌아서, 테스트가 실패해도 보안 규칙은 이미 운영에 나가 있었다(규칙 내용을 검사하는
  # 테스트도 있는데 그게 게시를 못 막았다). 이제 테스트가 통과해야 규칙도 사이트도 나간다.
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Run unit tests
        run: npm test

  # firestore.rules / storage.rules 는 GitHub Pages로 배포되지 않는다.
  # 2026-09-11·09-17 두 번 모두 "코드는 올라갔는데 규칙은 콘솔에 옛 버전"이라 현장이
  # permission-denied로 멈췄다. CI는 초록불인데 앱만 죽는 게 문제였다.
  # 그래서 규칙 배포를 사이트 배포보다 **먼저** 세우고, 실패하면 사이트도 안 나가게 한다.
  rules:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # 규칙 파일이 안 바뀐 푸시까지 매번 배포하면 Firebase 룰셋 이력만 쌓인다.
      - id: check
        name: 규칙 파일이 바뀌었는지 확인
        run: |
          if [ "${{ github.event_name }}" != "push" ]; then
            echo "규칙 파일 변경 여부와 상관없이 배포한다 (수동 실행)"
            echo "changed=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          before="${{ github.event.before }}"
          if [ -z "$before" ] || [ "$before" = "0000000000000000000000000000000000000000" ] \
             || ! git cat-file -e "$before^{commit}" 2>/dev/null; then
            echo "직전 커밋을 알 수 없어 그냥 배포한다"
            echo "changed=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if git diff --name-only "$before" "${{ github.sha }}" \
             | grep -qE '^(firestore\.rules|storage\.rules|firebase\.json)$'; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "규칙 파일 변경 없음 — 배포 생략"
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Firestore·Storage 규칙 배포
        if: steps.check.outputs.changed == 'true'
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          if [ -z "$FIREBASE_SERVICE_ACCOUNT" ]; then
            echo "::error::규칙 파일이 바뀌었는데 FIREBASE_SERVICE_ACCOUNT 시크릿이 없다. docs/firebase-rules-ci.md 참고. 등록 전까지는 Firebase 콘솔에 직접 붙여넣어 게시할 것."
            exit 1
          fi
          key="$RUNNER_TEMP/firebase-sa.json"
          printf '%s' "$FIREBASE_SERVICE_ACCOUNT" > "$key"
          trap 'rm -f "$key"' EXIT
          export GOOGLE_APPLICATION_CREDENTIALS="$key"
          npx --yes firebase-tools@13 deploy \
            --only firestore:rules,storage \
            --project building-safety-app-46821 \
            --non-interactive

  deploy:
    needs: [test, rules]
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # app.js는 app/ 조각을 이어 만든 파일이다(2026-11-08). 조각만 고치고 join을 안 했거나
      # app.js만 직접 고쳤으면 여기서 세운다 — 배포본과 조각이 다른 채로 나가지 않게.
      - name: app.js와 app/ 조각 일치 확인
        run: node scripts/app-parts.js check
      - name: Prepare static site
        run: python3 scripts/prepare-pages.py
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site
      # 2026-11-25부터 방금 올린 github-pages 묶음을 deploy-pages가 바로 못 찾고 「묶음 없음」으로 실패한다
      # (묶음은 실제로 올라가 있음). 한 번 실패하면 잠깐 기다렸다 다시 한다.
      - id: deploy1
        continue-on-error: true
        uses: actions/deploy-pages@v5
      - name: 다시 하기 전 기다림
        if: steps.deploy1.outcome == 'failure'
        run: sleep 60
      - id: deploy2
        if: steps.deploy1.outcome == 'failure'
        continue-on-error: true
        uses: actions/deploy-pages@v5
      - name: 다시 하기 전 기다림(2)
        if: steps.deploy1.outcome == 'failure' && steps.deploy2.outcome == 'failure'
        run: sleep 120
      - id: deploy3
        if: steps.deploy1.outcome == 'failure' && steps.deploy2.outcome == 'failure'
        uses: actions/deploy-pages@v5
      - id: deployment
        name: 배포 주소
        run: echo "page_url=${{ steps.deploy1.outputs.page_url || steps.deploy2.outputs.page_url || steps.deploy3.outputs.page_url }}" >> "$GITHUB_OUTPUT"
