    (function () {
        var ua = navigator.userAgent || '';
        var tablet = /iPad|Tablet|PlayBook|Silk/i.test(ua)
            || (/Android/i.test(ua) && !/Mobile/i.test(ua))

            var h = window.innerHeight || document.documentElement.clientHeight || 0;

        var desktopSite = (/Android/i.test(ua) && !/Mobile/i.test(ua))

        if (!desktopSite) return;
        document.documentElement.classList.add('layout-desktop');

        if (vp) vp.setAttribute('content', 'width=1280, initial-scale=1.0, minimum-scale=0.25, maximum-scale=5.0, user-scalable=yes');
    })();
    </script>
